# ============================================================================
# Layer 1 — "ГДЕ": карта пригодности вокруг Макона
# ----------------------------------------------------------------------------
# Всё, что можно крутить, лежит здесь. Меняешь -> перезапускаешь run_layer1.py
# (данные кэшируются, пересчёт занимает секунды).
# ============================================================================

area:
  center_lat: 46.3069
  center_lon: 4.8283
  radius_km: 25          # радиус зоны поиска
  cell_m: 200            # размер ячейки сетки (совпадает с сеткой INSEE)

# ---------------------------------------------------------------------------
# ПОРОГИ. Это НЕ обрыв: у каждого есть зона допуска (см. margins ниже).
# Значение лучше порога -> критерий выполнен полностью.
# Хуже порога -> оценка плавно падает и обнуляется через margin.
# null = критерий выключен.
# ---------------------------------------------------------------------------
hard:
  # --- Рельеф: "на горе, повыше, не в низине" ---
  tpi_1km_min_m: 2            # выше среднего уровня в радиусе 1 км, м
  rel_elev_2km_min_m: 12      # выше самой низкой точки в радиусе 2 км, м
  slope_max_pct: 25           # круче — не построить/не жить (терраса, бассейн)
  elev_min_m: 195             # ниже — пойма Соны (сырость, туман)

  # --- Шоссе: "доступ есть, но не под окном" ---
  dist_motorway_min_m: 800
  dist_trunk_primary_min_m: 300
  dist_motorway_junction_max_m: 18000

  # --- ЖД ---
  dist_rail_min_m: 800
  dist_rail_highspeed_min_m: 1500   # LGV Париж–Лион шумит сильнее

  # --- Окружение: поля/коровы против виноградников ---
  # доля пашни и лугов в радиусе 800 м (газоны и огороды сюда НЕ входят)
  farm_share_800m_max: 0.62
  dist_farmyard_min_m: 300    # ферма/скотный двор = мухи и запах
  dist_nuisance_min_m: 700    # карьер, свалка, очистные, крупный завод
  dist_light_industry_min_m: 250   # деревенская «зона ремесленников»

  # --- "Не 3 дома, не deep campagne" ---
  pop_2km_min: 300            # людей в радиусе 2 км (данные INSEE)
  dist_school_max_m: 5000
  dist_bakery_max_m: 5000

  # --- "Поблагополучней" ---
  income_1km_min_eur: 20000   # средний уровень жизни, €/чел/год (INSEE)
  social_housing_share_1km_max: 0.30

# ---------------------------------------------------------------------------
# ЗОНА ДОПУСКА («margin of error»).
# Насколько ниже порога место ещё считается частично приемлемым.
# Пример: dist_motorway 800 м с margin 350 -> на 800 м оценка 1.0,
# на 625 м — 0.5, на 450 м и ближе — 0.
# tolerance добавляет запас ко всем margin сразу: 0 = как задано, 0.5 = +50%.
# ---------------------------------------------------------------------------
tolerance: 0.0
margins:
  dist_motorway_min_m: 350
  dist_rail_min_m: 350
  dist_rail_highspeed_min_m: 600
  farm_share_800m_max: 0.18
  tpi_1km_min_m: 6
  rel_elev_2km_min_m: 12
  elev_min_m: 25
  pop_2km_min: 250
  income_1km_min_eur: 2500
  dist_school_max_m: 2500
  dist_bakery_max_m: 2500
  dist_motorway_junction_max_m: 5000

# ---------------------------------------------------------------------------
# ПРИВЛЕКАТЕЛЬНОСТЬ — из чего складывается балл 0..100.
# weight = вклад, bad/good = значения метрики, дающие 0 и 1.
# ---------------------------------------------------------------------------
soft:
  view:              {weight: 18, metric: rel_elev_5km,      bad: 10,    good: 120}   # вид, доминирование над местностью
  vineyard:          {weight: 14, metric: vineyard_share_1km, bad: 0.0,  good: 0.35}  # виноградники рядом
  quiet:             {weight: 12, metric: dist_motorway,     bad: 800,   good: 4000}
  income:            {weight: 12, metric: income_1km,        bad: 20000, good: 32000}
  no_farm:           {weight: 10, metric: farm_share_800m,   bad: 0.62,  good: 0.0}
  services:          {weight: 10, metric: dist_services,     bad: 5000,  good: 800}   # школа/булочная/магазин
  sun:               {weight:  8, metric: southness,         bad: -0.5,  good: 1.0}   # южный склон: солнце, терраса, бассейн
  forest:            {weight:  6, metric: forest_share_1km,  bad: 0.0,   good: 0.30}
  rail_far:          {weight:  5, metric: dist_rail,         bad: 800,   good: 5000}
  house_area:        {weight:  5, metric: mean_house_m2,     bad: 85,    good: 140}   # средний размер жилья в округе

# ---------------------------------------------------------------------------
# Выделение зон из непрерывного поля
# ---------------------------------------------------------------------------
zones:
  smooth_radius_m: 400     # сглаживание: убирает ложную детализацию OSM
  min_score: 52            # с какого балла участок попадает в «смотреть»
  min_cluster_cells: 15    # меньше — это шум, а не место (15 яч. = 60 га)
  peak_min_distance_m: 3000  # крупные массивы режем на участки вокруг вершин

# ---------------------------------------------------------------------------
# Справка по коммунам (нужна Слою 2: объявления привязаны к коммунам)
# ---------------------------------------------------------------------------
communes:
  min_good_cells: 6
  green_score: 60          # по 90-му перцентилю балла внутри коммуны
  amber_score: 48

output:
  dir: out
  top_n_report: 40

# ---------------------------------------------------------------------------
# Слой 2: критерии самого дома (место задаётся выше)
# ---------------------------------------------------------------------------
house:
  max_price: 350000
  min_area_m2: 100
  min_bedrooms: 3
  want_terrace: true        # терраса обязательна
  want_pool: false          # бассейн — плюс, но не требование
  min_place_score: 20       # дома в заведомо плохих местах не сохраняем
